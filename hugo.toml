baseURL = "http://localhost:1313/"
title = "My Blog"
theme = "hugo-coder"
languageCode = "en-us"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
pagerSize = 10

[markup]
[markup.highlight]
noClasses = false
style = "monokai"

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = false

[params]
author = "Max"
description = "A minimal Hugo blog"
keywords = "blog,developer,personal"
info = ["Developer", "Blogger"]
dateFormat = "January 2, 2006"
since = 2024
colorScheme = "auto"
hideColorSchemeToggle = false

[taxonomies]
category = "categories"
series = "series"
tag = "tags"

[[menu.main]]
name = "Home"
weight = 1
url = "/"

[[menu.main]]
name = "Blog"
weight = 2
url = "/posts/"
